<h2>CSS Default Values</h2>

<p><b>display</b> - Elements have default display values.</p>

<p><b>font-size</b> - Browsers have a default font size.</p>

<p><b>margin</b> - Some elements have default margins.</p>

<p><b>padding</b> - Some elements have default padding.</p>

<p><b>color</b> - Text has a default color.</p>
