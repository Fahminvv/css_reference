<h2>CSS Animatable Reference</h2>

<p>Animatable properties can change their values smoothly during an animation.</p>

<p><b>color</b> - Can be animated.</p>

<p><b>width</b> - Can be animated.</p>

<p><b>height</b> - Can be animated.</p>

<p><b>opacity</b> - Can be animated.</p>

<p><b>font-size</b> - Can be animated.</p>
