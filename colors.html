<h2>CSS Color Reference</h2>

<p><b>Color Name</b> - Example: red, blue, green.</p>

<p><b>Hexadecimal</b> - Example: #ff0000.</p>

<p><b>RGB</b> - Example: rgb(255, 0, 0).</p>

<p><b>RGBA</b> - Example: rgba(255, 0, 0, 0.5).</p>

<p><b>HSL</b> - Example: hsl(0, 100%, 50%).</p>
