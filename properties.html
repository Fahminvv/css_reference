<h2>CSS Properties Reference</h2>

<p><b>color</b> - Changes the text color.</p>

<p><b>background-color</b> - Sets the background color.</p>

<p><b>font-size</b> - Sets the size of text.</p>

<p><b>margin</b> - Sets space outside an element.</p>

<p><b>padding</b> - Sets space inside an element.</p>

<p><b>border</b> - Sets a border around an element.</p>
