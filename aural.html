<h2>CSS Aural Reference</h2>

<p>CSS Aural properties are used to control how web content is presented by speech synthesizers.</p>

<p><b>volume</b> - Controls the volume of speech.</p>

<p><b>voice-family</b> - Specifies the voice family.</p>

<p><b>speech-rate</b> - Specifies the speed of speech.</p>

<p><b>pause</b> - Specifies a pause before or after content.</p>
