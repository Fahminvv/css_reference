<h2>CSS Functions Reference</h2>

<p><b>rgb()</b> - Defines a color using red, green and blue values.</p>

<p><b>rgba()</b> - Defines a color with transparency.</p>

<p><b>calc()</b> - Performs calculations in CSS.</p>

<p><b>url()</b> - Specifies a URL.</p>

<p><b>var()</b> - Uses a CSS variable.</p>
