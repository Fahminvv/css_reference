<body>

<h2>CSS Units</h2>

<p><b>px</b> - Pixels.</p>

<p><b>%</b> - Percentage.</p>

<p><b>em</b> - Relative to the font size of the element.</p>

<p><b>rem</b> - Relative to the root element's font size.</p>

<p><b>vw</b> - Relative to the viewport width.</p>

<p><b>vh</b> - Relative to the viewport height.</p>

</body>
